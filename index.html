<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTML &amp; CSS Practice Exam</title>
<style>
  :root{
    --bg:#10131a;
    --panel:#171b24;
    --panel-2:#1d222d;
    --border:#2a3140;
    --text:#e7e9ee;
    --muted:#8891a3;
    --accent:#d7a34e;
    --info:#6ea8ff;
    --good:#48b57e;
    --good-soft:#173124;
    --bad:#e2635f;
    --bad-soft:#331c1c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  button{font-family:var(--sans);}
  ::selection{background:#3a4358;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(var(--panel), var(--panel) 92%, transparent);
    border-bottom:1px solid var(--border);
    padding:14px 20px 10px;
  }
  .top-row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .title{font-size:18px; font-weight:700; letter-spacing:0.2px;}
  .title span{color:var(--accent);}
  .mode-badge{font-size:12px; color:var(--muted); border:1px solid var(--border); padding:4px 10px; border-radius:100px; white-space:nowrap;}
  .mode-badge b{color:var(--good); font-weight:600;}
  .score-badge{font-size:12px; color:var(--text); border:1px solid var(--border); background:var(--panel-2); padding:4px 10px; border-radius:100px; white-space:nowrap;}
  .toprow-actions{display:flex; gap:8px; align-items:center;}
  .btn{border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:7px 12px; border-radius:6px; font-size:13px; cursor:pointer; transition:border-color .12s, background .12s;}
  .btn:hover{border-color:#42506b;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#241a06; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  .navstrip{display:flex; gap:6px; overflow-x:auto; padding:10px 0 2px; margin-top:10px; scrollbar-width:thin;}
  .navstrip::-webkit-scrollbar{height:6px;}
  .navstrip::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  .navdot{flex:0 0 auto; width:34px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--panel-2); color:var(--muted); font-family:var(--mono); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .navdot.attempted{color:var(--accent); border-color:#5a4a26;}
  .navdot.passed{color:var(--good); border-color:#2f5a44; background:var(--good-soft);}
  .navdot.failed{color:var(--bad); border-color:#5a3232; background:var(--bad-soft);}
  .navdot.current{outline:2px solid var(--info); outline-offset:1px;}

  main{display:grid; grid-template-columns: minmax(280px, 38%) 1fr; min-height:calc(100vh - 108px);}
  @media (max-width:880px){ main{grid-template-columns:1fr;} }
  .panel{padding:20px 22px;}
  .qpanel{border-right:1px solid var(--border); overflow-y:auto;}
  .eyebrow{font-size:12px; color:var(--muted); margin-bottom:6px;}
  h1.qtitle{font-size:20px; margin:0 0 12px; line-height:1.3;}
  h1.qtitle .num{color:var(--accent); font-family:var(--mono); font-size:16px; margin-right:8px;}
  .desc{color:#cfd3dc; line-height:1.6; font-size:14.5px; margin-bottom:18px;}
  .section-label{font-size:12px; color:var(--muted); font-weight:600; margin:18px 0 8px;}
  ul.tests{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  ul.tests li{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:#cfd3dc; border:1px solid var(--border); background:var(--panel-2); padding:9px 11px; border-radius:7px;}
  .mark{font-family:var(--mono); flex:0 0 auto; width:16px; text-align:center; color:var(--muted);}
  ul.tests li.pass .mark{color:var(--good);}
  ul.tests li.fail .mark{color:var(--bad);}
  .qnav{display:flex; justify-content:space-between; gap:8px; margin-top:22px;}

  .edpanel{display:flex; flex-direction:column;}
  .filebar{display:flex; align-items:center; border-bottom:1px solid var(--border); padding:0 4px;}
  .filetab{padding:10px 16px; font-size:13px; color:var(--text); font-family:var(--mono); border-bottom:2px solid var(--accent);}
  .filebar .attemptedFlag{margin-left:auto; padding-right:14px; font-size:11px; color:var(--muted); font-family:var(--mono);}
  .editorwrap{flex:1 1 320px; display:flex; flex-direction:column; min-height:280px; position:relative;}
  textarea.code{flex:1; width:100%; resize:none; border:0; outline:0; background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px; line-height:1.55; padding:14px 16px; tab-size:2;}
  .bottomtabs{display:flex; border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
  .bottomtabs .tab{flex:1; text-align:center; padding:10px 16px; font-size:13px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-family:var(--mono);}
  .bottomtabs .tab.active{color:var(--text); border-bottom-color:var(--accent);}
  .outputwrap{height:260px; display:flex; flex-direction:column;}
  iframe.preview{flex:1; width:100%; border:0; background:#fff;}
  .console{flex:1; overflow-y:auto; background:#0b0d12; font-family:var(--mono); font-size:12.5px; padding:12px 14px; color:#a9b1c3;}
  .console .line{margin-bottom:4px; white-space:pre-wrap;}
  .console .ok{color:var(--good);}
  .console .no{color:var(--bad);}
  .console .prompt{color:var(--info);}
  .actionbar{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap;}
  .solution{margin-top:10px; border:1px dashed var(--border); border-radius:8px; padding:12px 14px; background:var(--panel-2); font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; color:#b7bccb; display:none; max-height:320px; overflow-y:auto;}
  .solution.show{display:block;}

  .overlay{position:fixed; inset:0; background:rgba(8,10,14,.72); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:12px; max-width:640px; width:100%; max-height:82vh; overflow-y:auto; padding:26px 28px;}
  .card h2{margin:0 0 6px; font-size:20px;}
  .bigscore{font-family:var(--mono); font-size:38px; color:var(--accent); margin:14px 0 4px;}
  .card .subtle{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .breakdown{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-bottom:20px;}
  .breakdown div{font-family:var(--mono); font-size:11px; text-align:center; padding:6px 0; border-radius:5px; border:1px solid var(--border); color:var(--muted);}
  .breakdown div.p{color:var(--good); border-color:#2f5a44; background:var(--good-soft);}
  .breakdown div.f{color:var(--bad); border-color:#5a3232; background:var(--bad-soft);}
  .card .actions{display:flex; gap:10px; justify-content:flex-end;}
  .grading-msg{color:var(--muted); font-size:13px; text-align:center; padding:30px 0;}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="title">HTML &amp; CSS <span>Practice Exam</span></div>
    <div class="toprow-actions">
      <span class="mode-badge"><b>●</b> Practice mode — no timer</span>
      <span class="score-badge" id="scoreBadge">Solved 0 / 32</span>
      <button class="btn" id="restartBtn">Restart</button>
      <button class="btn primary" id="submitBtn">Submit Test</button>
    </div>
  </div>
  <div class="navstrip" id="navstrip"></div>
</header>

<main>
  <section class="panel qpanel">
    <div class="eyebrow" id="qEyebrow">Question 1 of 32</div>
    <h1 class="qtitle"><span class="num" id="qNum">Q2</span><span id="qTitle">Title</span></h1>
    <div class="desc" id="qDesc"></div>

    <div class="section-label">Test cases</div>
    <ul class="tests" id="testList"></ul>

    <div class="solution" id="solutionBox"></div>

    <div class="qnav">
      <button class="btn" id="prevBtn">← Previous</button>
      <button class="btn ghost" id="solutionBtn">Show solution</button>
      <button class="btn" id="nextBtn">Next →</button>
    </div>
  </section>

  <section class="panel edpanel" style="padding:0;">
    <div class="filebar">
      <div class="filetab" id="fileTab">index.html</div>
      <div class="attemptedFlag" id="attemptedFlag"></div>
    </div>
    <div class="editorwrap">
      <textarea class="code" id="codeEditor" spellcheck="false"></textarea>
    </div>
    <div class="bottomtabs">
      <div class="tab active" data-view="preview">Preview</div>
      <div class="tab" data-view="console">Console</div>
    </div>
    <div class="outputwrap">
      <iframe class="preview" id="previewFrame" title="live preview" sandbox="allow-same-origin"></iframe>
      <div class="console" id="consoleView" style="display:none;"></div>
    </div>
    <div class="actionbar">
      <button class="btn primary" id="runBtn">Run tests</button>
      <button class="btn ghost" id="resetBtn">Reset starter code</button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="card" id="overlayCard"></div>
</div>

<script>
(function(){

/* ============================= helpers ============================= */
const $  = (d,s)=>d.querySelector(s);
const $$ = (d,s)=>Array.from(d.querySelectorAll(s));
const style = (n,p)=> n ? getComputedStyle(n)[p] : '';
const approx = (a,b,tol=2)=> Math.abs(a-b) <= tol;

function isColorish(computed, named){
  const probe = document.createElement('div');
  probe.style.color = named;
  document.body.appendChild(probe);
  const want = getComputedStyle(probe).color;
  probe.remove();
  return computed === want;
}

function renderFrame(code, width){
  return new Promise(resolve=>{
    const f = document.createElement('iframe');
    f.style.cssText = `position:absolute;left:-9999px;top:0;width:${width||1000}px;height:800px;border:0;`;
    f.setAttribute('aria-hidden','true');
    document.body.appendChild(f);
    f.addEventListener('load', ()=>resolve(f), {once:true});
    f.srcdoc = code;
  });
}

/* ========================= question dataset ========================= */
/* `code` is the exact starter file the student edits (HTML + CSS together,
   just like the sheet). `solution` is the complete reference file. */
const Q = [];

Q.push({id:2, title:"Picture Perfect",
desc:`You're a photographer building an online gallery. Display an image centered on the screen. If the image doesn't load, visitors should still see a text description.`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q2 - Picture Perfect</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fafafa;
  }
</style>
</head>
<body>
  <!-- Write your code here -->
</body>
</html>`,
solution:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q2 - Picture Perfect</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fafafa;
  }
</style>
</head>
<body>
  <img src="cat.jpg" alt="Cute cat picture" width="300">
</body>
</html>`,
tests:[
  {desc:"Image element is present", fn:d=>!!$(d,'img')},
  {desc:"Image has non-empty alt text", fn:d=>{const i=$(d,'img'); return !!i && !!i.getAttribute('alt') && i.getAttribute('alt').trim().length>0;}},
  {desc:"Image sits inside the centered layout", fn:d=> style(d.body,'display')==='flex' && !!$(d,'img')}
]});

Q.push({id:3, title:"Stylish Words",
desc:`You're designing a magazine. Some words need bold emphasis, and others should be italicized for softer impact.`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q3 - Stylish Words</title>
</head>
<body>
  <p>
    <!-- Write your text here -->
  </p>
</body>
</html>`,
solution:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q3 - Stylish Words</title>
</head>
<body>
  <p>
    This is <b>bold</b> and this is <i>italic</i>.
  </p>
</body>
</html>`,
tests:[
  {desc:"At least one bold word", fn:d=>!!$(d,'b')||!!$(d,'strong')},
  {desc:"At least one italic word", fn:d=>!!$(d,'i')||!!$(d,'em')},
  {desc:"Both sit inside one paragraph", fn:d=>{const p=$(d,'p'); return !!p && !!p.querySelector('b,strong') && !!p.querySelector('i,em');}}
]});

Q.push({id:4, title:"Grocery List",
desc:`You're creating a shopping list. Fruits should appear as a bullet list, and instructions should appear as a numbered list.`,
code:`<!DOCTYPE html>
<html lang="en">

</body>
</html>`,
solution:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q4 - Grocery List</title>
</head>
<body>
  <ul>
    <li>Apples</li>
    <li>Bananas</li>
  </ul>

</body>
</html>`,
tests:[
  {desc:"Fruits shown in an unordered list", fn:d=>{const u=$(d,'ul'); return !!u && u.querySelectorAll('li').length>=1;}},
  {desc:"Steps shown in an ordered list", fn:d=>{const o=$(d,'ol'); return !!o && o.querySelectorAll('li').length>=1;}}
]});

Q.push({id:5, title:"People Table",
desc:`You're asked to display user details (Name, Age, City) in a table format.`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q5 - People Table</title>
</head>
<body>
  <!-- Write your code here -->
</body>
</html>`,
solution:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q5 - People Table</title>
</head>
<body>
  <table border="1">
    <tr>
      <th>Name</th>

      <th>City</th>
    </tr>
    <tr>
      <td>John</td>
      <td>25</td>
      <td>Delhi</td>
    </tr>
  </table>
</body>
</html>`,
tests:[
  {desc:"Table has a header row", fn:d=>{const t=$(d,'table'); return !!t && t.querySelectorAll('th').length>=1;}},
  {desc:"Table has at least one data row", fn:d=>{const t=$(d,'table'); return !!t && t.querySelectorAll('tr').length>=2;}},
  {desc:"Columns include Name, Age, City", fn:d=>{const ths=$$(d,'th').map(x=>x.textContent.trim().toLowerCase()); return ['name','age','city'].every(k=>ths.includes(k));}}
]});

Q.push({id:6, title:"Identity Form",
desc:`Your client wants a simple form to collect a person's name and gender, with a submit button at the end.`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q6 - Identity Form</title>
</head>
<body>
  <!-- Write your code here -->
</body>
</html>`,
solution:`<!DOCTYPE html>

tests:[

  {desc:"Submit button present", fn:d=>!!$(d,'button, input[type="submit"]')}
]});

code:`<!DOCTYPE html>

Q.push({id:13, title:"The Box Model",
desc:`Design a profile card. Apply padding inside the box, a border around it, and a margin outside it — the CSS box model.`,
code:`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Q13 - Box Model</title>
<style>
  div {
    /* Write your CSS here */
  }
</style>

/* ============================= state ============================= */
const answers = {};
Q.forEach(q=> answers[q.id] = {code:q.code, attempted:false, results:null});

let currentIndex = 0;
let activeView = 'preview';

const els = {
  navstrip: document.getElementById('navstrip'),
  qEyebrow: document.getElementById('qEyebrow'),
  qNum: document.getElementById('qNum'),
  qTitle: document.getElementById('qTitle'),
  qDesc: document.getElementById('qDesc'),
  testList: document.getElementById('testList'),
  solutionBox: document.getElementById('solutionBox'),
  solutionBtn: document.getElementById('solutionBtn'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  codeEditor: document.getElementById('codeEditor'),
  previewFrame: document.getElementById('previewFrame'),
  consoleView: document.getElementById('consoleView'),
  runBtn: document.getElementById('runBtn'),
  resetBtn: document.getElementById('resetBtn'),
  scoreBadge: document.getElementById('scoreBadge'),
  submitBtn: document.getElementById('submitBtn'),
  restartBtn: document.getElementById('restartBtn'),
  overlay: document.getElementById('overlay'),
  overlayCard: document.getElementById('overlayCard'),
  attemptedFlag: document.getElementById('attemptedFlag'),
  fileTab: document.getElementById('fileTab'),
};

/* ============================= nav strip ============================= */
function buildNavStrip(){
  els.navstrip.innerHTML = '';
  Q.forEach((q, i)=>{
    const b = document.createElement('button');
    b.className = 'navdot';
    b.textContent = q.id;
    b.dataset.idx = i;
    b.addEventListener('click', ()=> goTo(i));
    els.navstrip.appendChild(b);
  });
  refreshNavStrip();
}
function refreshNavStrip(){
  const dots = Array.from(els.navstrip.children);
  let solved = 0;
  dots.forEach((dot, i)=>{
    const a = answers[Q[i].id];
    dot.classList.remove('attempted','passed','failed','current');
    if(a.results){
      const allPass = a.results.every(r=>r.passed);
      dot.classList.add(allPass ? 'passed' : 'failed');
      if(allPass) solved++;
    } else if(a.attempted){
      dot.classList.add('attempted');
    }
    if(i===currentIndex) dot.classList.add('current');
  });
  els.scoreBadge.textContent = `Solved ${solved} / ${Q.length}`;
}

/* ============================= rendering question ============================= */
function loadQuestion(i){
  currentIndex = i;
  const q = Q[i];
  const a = answers[q.id];
  els.qEyebrow.textContent = `Question ${i+1} of ${Q.length}`;
  els.qNum.textContent = `Q${q.id}`;
  els.qTitle.textContent = ' — ' + q.title;
  els.qDesc.textContent = q.desc;
  els.codeEditor.value = a.code;
  els.fileTab.textContent = `q${q.id}.html`;
  els.solutionBox.classList.remove('show');
  els.solutionBox.innerHTML = '';
  els.solutionBtn.textContent = 'Show solution';
  els.prevBtn.disabled = i===0;
  els.nextBtn.disabled = i===Q.length-1;
  renderTestList(q, a.results);
  updateAttemptedFlag(a);
  updatePreview();
  renderConsole(a.results, q);
  refreshNavStrip();
}

function updateAttemptedFlag(a){
  els.attemptedFlag.textContent = a.attempted ? 'edited' : 'unedited';
}

function renderTestList(q, results){
  els.testList.innerHTML = '';
  q.tests.forEach((t, idx)=>{
    const li = document.createElement('li');
    let markChar = '○', cls='';
    if(results){
      const r = results[idx];
      if(r.passed){ markChar='✓'; cls='pass'; } else { markChar='✕'; cls='fail'; }
    }
    li.className = cls;
    li.innerHTML = `<span class="mark">${markChar}</span><span>${t.desc}</span>`;
    els.testList.appendChild(li);
  });
}

function renderConsole(results, q){
  if(!results){
    els.consoleView.innerHTML = `<div class="line prompt">$ waiting to run tests for Q${q.id}…</div><div class="line">Click "Run tests" to check your code.</div>`;
    return;
  }
  let out = `<div class="line prompt">$ running test suite for Q${q.id}</div>`;
  results.forEach(r=>{
    out += `<div class="line ${r.passed?'ok':'no'}">[${r.passed?'PASS':'FAIL'}] ${r.desc}</div>`;
  });
  const passed = results.filter(r=>r.passed).length;
  out += `<div class="line prompt">$ ${passed}/${results.length} checks passed</div>`;
  els.consoleView.innerHTML = out;
  els.consoleView.scrollTop = els.consoleView.scrollHeight;
}

/* ============================= preview ============================= */
let previewTimer = null;
function updatePreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(()=>{
    const q = Q[currentIndex];
    const a = answers[q.id];
    els.previewFrame.srcdoc = a.code;
  }, 300);
}

/* ============================= editor ============================= */
els.codeEditor.addEventListener('input', ()=>{
  const q = Q[currentIndex];
  const a = answers[q.id];
  a.code = els.codeEditor.value;
  a.attempted = (a.code !== q.code);
  a.results = null;
  updateAttemptedFlag(a);
  updatePreview();
  renderTestList(q, null);
  renderConsole(null, q);
  refreshNavStrip();
});

els.codeEditor.addEventListener('keydown', (e)=>{
  if(e.key === 'Tab'){
    e.preventDefault();
    const t = e.target;
    const start = t.selectionStart, end = t.selectionEnd;
    t.value = t.value.slice(0,start) + '  ' + t.value.slice(end);
    t.selectionStart = t.selectionEnd = start + 2;
    t.dispatchEvent(new Event('input'));
  }
});

/* bottom tabs (Preview/Console) */
document.querySelectorAll('.tab[data-view]').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeView = tab.dataset.view;
    els.previewFrame.style.display = activeView==='preview' ? 'block' : 'none';
    els.consoleView.style.display = activeView==='console' ? 'block' : 'none';
  });
});

/* ============================= run tests ============================= */
async function runChecksForQuestion(q, code){
  const frame = await renderFrame(code, 1000);
  const doc = frame.contentDocument;
  const ctx = {code};
  const results = [];
  for(const t of q.tests){
    let passed = false;
    try{ passed = await t.fn(doc, ctx); } catch(e){ passed = false; }
    results.push({desc:t.desc, passed: !!passed});
  }
  frame.remove();
  return results;
}

els.runBtn.addEventListener('click', async ()=>{
  const q = Q[currentIndex];
  const a = answers[q.id];
  els.runBtn.disabled = true;
  els.runBtn.textContent = 'Running…';
  document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab[data-view="console"]').classList.add('active');
  activeView = 'console';
  els.previewFrame.style.display = 'none';
  els.consoleView.style.display = 'block';
  const results = await runChecksForQuestion(q, a.code);
  a.results = results;
  a.attempted = true;
  renderTestList(q, results);
  renderConsole(results, q);
  refreshNavStrip();
  updateAttemptedFlag(a);
  els.runBtn.disabled = false;
  els.runBtn.textContent = 'Run tests';
});

els.resetBtn.addEventListener('click', ()=>{
  const q = Q[currentIndex];
  const a = answers[q.id];
  a.code = q.code; a.attempted = false; a.results = null;
  loadQuestion(currentIndex);
});

els.solutionBtn.addEventListener('click', ()=>{
  const q = Q[currentIndex];
  const showing = els.solutionBox.classList.toggle('show');
  els.solutionBtn.textContent = showing ? 'Hide solution' : 'Show solution';
  if(showing){
    els.solutionBox.textContent = q.solution;
  }
});

els.prevBtn.addEventListener('click', ()=>{ if(currentIndex>0) goTo(currentIndex-1); });
els.nextBtn.addEventListener('click', ()=>{ if(currentIndex<Q.length-1) goTo(currentIndex+1); });
function goTo(i){ loadQuestion(i); }

/* ============================= restart ============================= */
els.restartBtn.addEventListener('click', ()=>{
  if(!confirm('Restart the whole test? This clears all your answers.')) return;
  Q.forEach(q=> answers[q.id] = {code:q.code, attempted:false, results:null});
  loadQuestion(0);
});

/* ============================= submit / grade all ============================= */
els.submitBtn.addEventListener('click', async ()=>{
  els.overlay.classList.add('show');
  els.overlayCard.innerHTML = `<div class="grading-msg" id="gradingMsg">Grading question 1 of ${Q.length}…</div>`;
  const msg = document.getElementById('gradingMsg');

  let totalChecks = 0, passedChecks = 0, solvedCount = 0;
  const perQ = [];

  for(let i=0;i<Q.length;i++){
    const q = Q[i];
    const a = answers[q.id];
    msg.textContent = `Grading question ${i+1} of ${Q.length}…`;
    const results = await runChecksForQuestion(q, a.code);
    a.results = results;
    const allPass = results.every(r=>r.passed);
    if(allPass) solvedCount++;
    totalChecks += results.length;
    passedChecks += results.filter(r=>r.passed).length;
    perQ.push({id:q.id, allPass});
  }
  refreshNavStrip();
  renderTestList(Q[currentIndex], answers[Q[currentIndex].id].results);
  renderConsole(answers[Q[currentIndex].id].results, Q[currentIndex]);

  const breakdownHtml = perQ.map(p=>`<div class="${p.allPass?'p':'f'}">Q${p.id}</div>`).join('');
  els.overlayCard.innerHTML = `
    <h2>Test submitted</h2>
    <div class="subtle">Here's how you did across all ${Q.length} questions.</div>
    <div class="bigscore">${solvedCount} / ${Q.length}</div>
    <div class="subtle">questions fully solved &nbsp;·&nbsp; ${passedChecks} / ${totalChecks} individual checks passed</div>
    <div class="breakdown">${breakdownHtml}</div>
    <div class="actions">
      <button class="btn" id="closeOverlay">Review answers</button>
    </div>
  `;
  document.getElementById('closeOverlay').addEventListener('click', ()=>{
    els.overlay.classList.remove('show');
  });
});

/* ============================= init ============================= */
buildNavStrip();
loadQuestion(0);

})();
</script>
</body>
</html>
